name: tests

on:
  push:
    branches: [main]
  pull_request:

# release storms stack runs (each push queues the full 7-job matrix);
# a newer run on the same ref supersedes the older queued/in-progress one
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # flua pins lupa>=2.6,<2.7 (the last Lua 5.4-bundling release — 2.7+
      # bundles Lua 5.5, whose const for-loop variables break HC3 QA code).
      # 2.6 ships wheels for cp311-cp314 everywhere; only cp315 has none, so
      # the 3.15 track compiles it from source — build once and cache the
      # wheel (keyed on pyproject, so a lupa bump rebuilds). The other tracks
      # install binary wheels and skip these entirely.
      #
      # The wheel is installed BY PATH with a version-pinned glob: the cache
      # once held an UNCONSTRAINED `pip wheel lupa` artifact (2.8 — Lua 5.5,
      # which the <2.7 pin excludes). The resolver correctly rejected it and
      # rebuilt 2.6 from source every run (~2 min, live-verified) — so the
      # glob names the pinned version, a poisoned cache triggers the
      # constrained rebuild, and the path-install never re-resolves.
      #
      # restore-keys reuses the previous wheel when the exact key misses —
      # pyproject.toml changes with EVERY release (the version bump), so a
      # strict key would force a full lupa compile per release. A restored
      # wheel still satisfies the pin; if it is ever raised, the
      # path-install fails and the fallback compiles from source again —
      # correct, just slower, exactly when it matters.
      # save-always is deprecated (it never did what it claimed), so the
      # cache is split: actions/cache/restore before the build and
      # actions/cache/save (if: always()) after it. One consequence: the
      # save action never overwrites an existing key, so a poisoned exact
      # key is no longer healed IN PLACE — the install step still rebuilds
      # the bad wheel each run (correct, ~2 min slower), and the healed
      # wheels/ are re-cached when the next pyproject bump creates a new
      # key. Worst case: one release cycle of slow rebuilds, then clean.
      - name: Restore built lupa wheel (3.15 only)
        id: lupa-cache
        if: matrix.python-version == '3.15'
        uses: actions/cache/restore@v5
        with:
          path: wheels
          key: lupa-cp315-v2-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            lupa-cp315-v2-
      - name: Install lupa wheel (3.15 only)
        if: matrix.python-version == '3.15'
        run: |
          pip install wheel
          if ! ls wheels/lupa-2.6-*.whl >/dev/null 2>&1 || ! pip install wheels/lupa-2.6-*.whl; then
            rm -f wheels/lupa-*
            pip wheel "lupa>=2.6,<2.7" --no-deps -w wheels
            pip install wheels/lupa-2.6-*.whl
          fi
      - name: Save built lupa wheel (3.15 only)
        if: ${{ matrix.python-version == '3.15' && always() }}
        uses: actions/cache/save@v5
        with:
          path: wheels
          key: ${{ steps.lupa-cache.outputs.cache-primary-key }}
      - name: Install
        run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: pytest tests/ -q --ignore=tests/test_hc3_live.py --ignore=tests/test_hc3_compat.py

  wheel:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      # install the built wheel into a clean venv and smoke-test the pip
      # user's commands — catches packaging gaps (e.g. a template the
      # package-data globs dropped, which the source-tree tests can't see).
      # Windows runs the same smoke (git-bash): the author develops on
      # macOS daily, Windows is where CI has to catch what that misses.
      - name: smoke-test the built wheel (clean venv)
        shell: bash
        run: |
          python -m venv ./.wheelvenv
          # absolute: the smoke steps cd to /tmp/wheelsmoke later, and a
          # relative $BIN would not survive that
          if [ -d ./.wheelvenv/Scripts ]; then BIN="$PWD/.wheelvenv/Scripts"; else BIN="$PWD/.wheelvenv/bin"; fi
          "$BIN/pip" install dist/*.whl
          "$BIN/flua" --version
          mkdir -p /tmp/wheelsmoke && cd /tmp/wheelsmoke
          "$BIN/flua" --tool setup project
          "$BIN/flua" --tool newQA binarySwitch "Smoke QA"
          "$BIN/flua" --check binarySwitch.lua
