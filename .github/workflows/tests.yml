name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # lupa has no cp315 binary wheels yet, so the 3.15 track compiles it
      # from source — build once and cache the wheel (keyed on pyproject, so
      # a lupa bump rebuilds). The other tracks install binary wheels and
      # skip this entirely.
      - name: Cache built lupa wheel (3.15)
        if: matrix.python-version == '3.15'
        uses: actions/cache@v4
        with:
          path: wheels
          key: lupa-cp315-${{ hashFiles('pyproject.toml') }}
      - name: Build lupa wheel (3.15)
        if: matrix.python-version == '3.15'
        run: |
          pip install wheel
          if ! ls wheels/lupa-*.whl >/dev/null 2>&1; then
            pip wheel lupa --no-deps -w wheels
          fi
      - name: Install (3.15, with the built lupa wheel)
        if: matrix.python-version == '3.15'
        run: pip install --find-links wheels -e ".[dev]"
      - name: Install
        if: matrix.python-version != '3.15'
        run: pip install -e ".[dev]"
      - run: ruff check src/ tests/
      - run: pytest tests/ -q --ignore=tests/test_hc3_live.py --ignore=tests/test_hc3_compat.py

  wheel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      # install the built wheel into a clean venv and smoke-test the pip
      # user's commands — catches packaging gaps (e.g. a template the
      # package-data globs dropped, which the source-tree tests can't see)
      - run: |
          python -m venv /tmp/wheelvenv
          /tmp/wheelvenv/bin/pip install dist/*.whl
          /tmp/wheelvenv/bin/flua --version
          mkdir -p /tmp/wheelsmoke && cd /tmp/wheelsmoke
          /tmp/wheelvenv/bin/flua --tool setup project
          /tmp/wheelvenv/bin/flua --tool newQA binarySwitch "Smoke QA"
          /tmp/wheelvenv/bin/flua --check binarySwitch.lua
