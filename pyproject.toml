[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fibaro-flua"
version = "0.1.61"
description = "Develop Fibaro Home Center 3 QuickApps offline: the HC3 Lua runtime (QuickApp, fibaro, api, net, mqtt) with a simulated HC3, virtual time, and a real debugger"
authors = [{name = "Jan Gabrielsson", email = "jan@gabrielsson.com"}]
license = {file = "LICENSE"}
readme = "USAGE.md"
requires-python = ">=3.11"
keywords = ["fibaro", "hc3", "home center", "quickapp", "lua", "smart home", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Interpreters",
]
dependencies = [
    "lupa>=2.8",            # 2.7+ bundles Lua 5.5 (2.8 fixes the non-x86_64 sdist);
    #                        flua develops/tests against Lua 5.5 — bump to 2.9
    #                        when it ships (GH#294: Lua 5.5 GC fix for Python
    #                        objects crossing into Lua)
]

[project.urls]
Repository = "https://github.com/jangabrielsson/flua"
Documentation = "https://github.com/jangabrielsson/flua/blob/main/USAGE.md"
Issues = "https://github.com/jangabrielsson/flua/issues"

[project.scripts]
flua = "flua.cli:main"
flua-mcp = "flua.mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.6",
    "ruff>=0.6.0",
]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
# flua.examples maps onto the repo's examples/ directory (package-dir), so
# the wheel ships the QuickApp examples without duplicating them — pip users
# find them through `flua --examples`.
where = ["src", "examples"]
include = ["flua*"]

[tool.setuptools.package-dir]
"" = "src"
"flua.examples" = "examples"

[tool.setuptools.package-data]
flua = [
    "lua/*.lua",
    "lua/lib/*.lua",
    "devices/*.json",
    "setup_templates/**/*",
    # globs don't match dotfiles — .luarc.json would be dropped from the wheel
    "setup_templates/.luarc.json",
]
"flua.examples" = ["*.lua", "house.json", "multifile/*.lua"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["src/flua/setup_templates"]  # vendored template files (skills etc.), not flua code

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-n auto"
markers = [
    "hc3: live tests against a real HC3 (opt-in: set HC3_TEST=1 and configure HC3 credentials in the environment)",
    "slow: tests that spend real wall-clock time (long polls, protocol settle, example fixtures) — skipped by the fast gate (-m 'not slow')",
]