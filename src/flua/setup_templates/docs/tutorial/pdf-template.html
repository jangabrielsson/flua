<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$if(title)$$title$ — $endif$flua tutorial</title>
  <style>
    @page { size: A4; margin: 18mm 16mm; }
    body {
      font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 11pt; line-height: 1.5; color: #1a1a1a;
      max-width: 100%;
    }
    h1.title { font-size: 24pt; margin: 0 0 6mm 0; page-break-after: avoid; }
    h1 { font-size: 19pt; page-break-before: always; margin-top: 0; }
    h2 { font-size: 14pt; margin-top: 8mm; }
    h3 { font-size: 12pt; }
    a { color: #1565c0; text-decoration: none; }
    code {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 9.5pt; background: #f2f4f7; padding: 1px 4px; border-radius: 3px;
    }
    pre {
      background: #f6f8fa; border: 1px solid #e3e7ec; border-radius: 6px;
      padding: 8px 12px; overflow-x: auto; page-break-inside: avoid;
    }
    pre code { background: none; padding: 0; font-size: 9.5pt; }
    blockquote {
      margin: 6mm 0; padding: 2mm 6mm; border-left: 4px solid #1565c0;
      background: #f5f8fc; page-break-inside: avoid;
    }
    .mermaid, pre.mermaid, code.mermaid {
      text-align: center; background: none; border: none; page-break-inside: avoid;
    }
    nav#TOC { page-break-after: always; }
    nav#TOC ul { list-style: none; padding-left: 0; }
    nav#TOC li { margin: 2px 0; }
    nav#TOC > ul > li > a { font-weight: bold; }
    nav#TOC ul ul { padding-left: 6mm; }
    img { max-width: 100%; }
    hr { border: none; border-top: 1px solid #ddd; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: true, theme: "neutral" });
  </script>
</head>
<body>
$if(title)$<h1 class="title">$title$</h1>$endif$
$if(toc)$
<nav id="TOC" role="doc-toc">
<h2>Contents</h2>
$toc$
</nav>
$endif$
$body$
</body>
</html>
