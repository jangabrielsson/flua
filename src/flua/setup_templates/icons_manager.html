<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HC3 Icon Manager</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #1c2430; --muted: #6a7482;
    --line: #dde2e8; --accent: #2563eb; --danger: #b91c1c; --ok: #15803d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line);
    padding: 14px 24px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header .hc3 { color: var(--muted); font-family: ui-monospace, monospace; font-size: 13px; }
  main { max-width: 860px; margin: 24px auto; padding: 0 24px; display: grid; gap: 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tabs button { font: inherit; padding: 7px 16px; border-radius: 6px; border: 1px solid var(--line);
    background: #fff; cursor: pointer; color: var(--muted); }
  .tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  label { color: var(--muted); font-size: 13px; min-width: 110px; }
  select, button { font: inherit; padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: #fff; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
  button.danger { color: var(--danger); border-color: var(--danger); cursor: pointer; background: #fff; }
  button:disabled { opacity: .55; cursor: default; }
  input[type=file] { font: inherit; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  td img { width: 40px; height: 40px; object-fit: contain; display: block; background: #fff; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #eef2f7; color: var(--muted); }
  .badge.binary { background: #e0edff; color: #1d4ed8; }
  .badge.multilevel { background: #e6f7ec; color: var(--ok); }
  .badge.shutter { background: #fdf0e4; color: #9a4d0d; }
  .mono { font-family: ui-monospace, monospace; font-size: 13px; }
  #status { color: var(--muted); font-size: 13px; min-height: 1.2em; }
  #status.error { color: var(--danger); }
  #status.ok { color: var(--ok); }
  .hint { color: var(--muted); font-size: 13px; }
  #popup { position: fixed; z-index: 50; background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px;
    box-shadow: 0 6px 22px rgba(16, 24, 40, .18); display: none; max-width: 480px; }
  #popup .states { display: flex; gap: 10px; flex-wrap: wrap; }
  #popup .state { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  #popup .state img { width: 64px; height: 64px; object-fit: contain; }
  #popup .state span { font-size: 11px; color: var(--muted); font-family: ui-monospace, monospace; }
  td.preview { cursor: default; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>HC3 Icon Manager</h1>
  <span class="hc3" id="hc3"></span>
  <button class="primary" id="refresh" style="margin-left:auto">Refresh</button>
</header>
<main>
  <div class="tabs">
    <button data-cat="device" class="active">Devices</button>
    <button data-cat="room">Rooms</button>
    <button data-cat="scene">Scenes</button>
  </div>

  <section class="card" id="deviceUpload">
    <h2>Upload a device icon set</h2>
    <div class="row">
      <label for="deviceType">Device type</label>
      <select id="deviceType"></select>
    </div>
    <div id="fileFields" class="row"></div>
    <div class="row">
      <button class="primary" id="upload">Upload</button>
      <span class="hint">PNG files, at least 128×128. One file per state below.</span>
    </div>
  </section>

  <section class="card hidden" id="singleUpload">
    <h2 id="singleUploadTitle">Upload an icon</h2>
    <div class="row">
      <label for="singleFile">Icon PNG</label>
      <input type="file" id="singleFile" accept="image/png">
    </div>
    <div class="row">
      <label for="singleExt">Extension</label>
      <input type="text" id="singleExt" value="png" size="6" class="mono">
    </div>
    <div class="row">
      <button class="primary" id="uploadSingle">Upload</button>
      <span class="hint">PNG, at least 128×128.</span>
    </div>
  </section>

  <section class="card">
    <h2 id="listTitle">User icon sets</h2>
    <p class="hint" id="summary"></p>
    <table>
      <thead id="thead"></thead>
      <tbody id="icons"></tbody>
    </table>
  </section>

  <div id="status"></div>
</main>

<script>
"use strict";
const $ = (sel) => document.querySelector(sel);
let FAMILIES = {}, STATES = {}, LISTS = {}, currentCat = "device";

function status(msg, kind) {
  const el = $("#status");
  el.textContent = msg;
  el.className = kind || "";
}

async function api(path, options) {
  const res = await fetch(path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.status + " " + res.statusText);
  return data;
}

function previewUrl(cat, name, file) {
  return `/api/preview?cat=${encodeURIComponent(cat)}&set=${encodeURIComponent(name)}&file=${encodeURIComponent(file)}`;
}

// candidate state suffixes, in probe order — the superset of every
// provider family's states plus the extras the tree might serve
const CANDIDATE_STATES = [
  "0", "100", "", "10", "20", "30", "40", "50", "60", "70", "80", "90",
  "255", "Unknown", "Opening", "Opened", "Closing", "Closed", "PartialOpen",
];

function stateURL(setName, ext, suffix) {
  return previewUrl("device", setName, setName + suffix + "." + ext);
}

function makeImg(setName, ext, family) {
  // the table thumbnail: the family's own states first, then every other
  // candidate — the HC3 entry's deviceType is not always trustworthy
  // (older web uploads), so the tree itself is the truth. Never leaks alt
  // text: a total failure removes the image silently.
  const preferred = STATES[family] || [""];
  const order = preferred.concat(CANDIDATE_STATES.filter((s) => !preferred.includes(s)));
  const img = document.createElement("img");
  img.alt = "";
  let i = 0;
  img.onerror = () => {
    i += 1;
    if (i < order.length) {
      img.src = stateURL(setName, ext, order[i]);
    } else {
      img.remove();
    }
  };
  img.src = stateURL(setName, ext, order[0]);
  return img;
}

function makeSingleImg(cat, name, ext) {
  const img = document.createElement("img");
  img.alt = "";
  img.onerror = () => img.remove();
  img.src = previewUrl(cat, name, name + "." + ext);
  return img;
}

function classifyFamily(found) {
  // infer the provider family from the states that actually serve
  const has = (s) => found.includes(s);
  const named = has("Opening") || has("Opened") || has("Closing") || has("Closed");
  const tens = CANDIDATE_STATES.filter((s) => /^\d0$/.test(s) && s !== "0" && s !== "100")
    .filter(has).length;
  if (named) return "baseShutter";
  if (tens >= 3) return "multilevel";
  if (has("0") || has("100")) return "binary";
  if (has("")) return "single";
  return "unknown";
}

// hover popup (devices only): probe ALL candidate states and show the ones
// the tree actually serves — misclassified sets still show their real icons
const popup = document.createElement("div");
popup.id = "popup";
document.body.appendChild(popup);

function attachPopup(cell, setName, ext, badge) {
  cell.addEventListener("mouseenter", (event) => {
    const wrap = document.createElement("div");
    wrap.className = "states";
    const found = [];
    let pending = CANDIDATE_STATES.length;
    const finish = () => {
      popup.textContent = "";
      popup.appendChild(wrap);
      popup.style.display = "block";
      movePopup(event);
      const family = classifyFamily(found);
      if (family !== "unknown") {
        badge.textContent = family;
        badge.className = "badge " + (family === "single" ? "" : family);
      }
    };
    for (const suffix of CANDIDATE_STATES) {
      const img = new Image();
      img.onload = () => {
        found.push(suffix);
        const state = document.createElement("div");
        state.className = "state";
        img.alt = "";
        const label = document.createElement("span");
        label.textContent = suffix || "base";
        state.append(img, label);
        wrap.appendChild(state);
        pending -= 1;
        if (pending === 0) finish();
      };
      img.onerror = () => {
        pending -= 1;
        if (pending === 0) finish();
      };
      img.src = stateURL(setName, ext, suffix);
    }
  });
  cell.addEventListener("mousemove", movePopup);
  cell.addEventListener("mouseleave", () => { popup.style.display = "none"; });
}

function movePopup(event) {
  const margin = 16;
  const rect = popup.getBoundingClientRect();
  let left = event.clientX + margin;
  let top = event.clientY + margin;
  if (left + rect.width > window.innerWidth) left = event.clientX - rect.width - margin;
  if (top + rect.height > window.innerHeight) top = event.clientY - rect.height - margin;
  popup.style.left = Math.max(4, left) + "px";
  popup.style.top = Math.max(4, top) + "px";
}

async function refresh() {
  status("loading…");
  const data = await api("/api/list");
  $("#hc3").textContent = data.hc3;
  LISTS = data.icons || {};
  renderTab();
  status("listed", "ok");
}

function userEntries(cat) {
  const entries = LISTS[cat] || [];
  return entries.filter((e) => /^User\d+$/.test(e.iconSetName || e.iconName || ""));
}

function renderTab() {
  const cat = currentCat;
  $("#deviceUpload").classList.toggle("hidden", cat !== "device");
  $("#singleUpload").classList.toggle("hidden", cat === "device");
  $("#singleUploadTitle").textContent = cat === "room" ? "Upload a room icon" : "Upload a scene icon";
  $("#listTitle").textContent =
    cat === "device" ? "User device icon sets" : cat === "room" ? "User room icons" : "User scene icons";

  const users = userEntries(cat);
  $("#summary").textContent = users.length + " user icon(s) on this controller";

  const thead = $("#thead");
  thead.textContent = "";
  const trHead = document.createElement("tr");
  const heads = cat === "device"
    ? ["", "id", "set", "kind", "extension", ""]
    : ["", "id", "name", "extension", ""];
  for (const h of heads) {
    const th = document.createElement("th"); th.textContent = h; trHead.appendChild(th);
  }
  thead.appendChild(trHead);

  const tbody = $("#icons");
  tbody.textContent = "";
  for (const icon of users) {
    const tr = document.createElement("tr");
    if (cat === "device") {
      const family = icon.family || FAMILIES[icon.deviceType] || "single";
      const tdImg = document.createElement("td");
      tdImg.className = "preview";
      tdImg.appendChild(makeImg(icon.iconSetName, icon.fileExtension, family));
      const tdId = cell("td", String(icon.id), "mono");
      const tdSet = cell("td", icon.iconSetName, "mono");
      const tdKind = document.createElement("td");
      const badge = document.createElement("span");
      badge.className = "badge " + (family === "single" ? "" : family);
      badge.textContent = family;
      tdKind.appendChild(badge);
      // the popup probes the tree and corrects the badge when the HC3's
      // deviceType misleads (older web uploads classify as single)
      attachPopup(tdImg, icon.iconSetName, icon.fileExtension, badge);
      const tdExt = cell("td", icon.fileExtension, "mono");
      const tdDel = document.createElement("td");
      tdDel.appendChild(deleteButton(icon.iconSetName, icon.id, icon.fileExtension));
      tr.append(tdImg, tdId, tdSet, tdKind, tdExt, tdDel);
    } else {
      const name = icon.iconName;
      const tdImg = document.createElement("td");
      tdImg.appendChild(makeSingleImg(cat, name, icon.fileExtension));
      const tdId = cell("td", String(icon.id), "mono");
      const tdName = cell("td", name, "mono");
      const tdExt = cell("td", icon.fileExtension, "mono");
      const tdDel = document.createElement("td");
      tdDel.appendChild(deleteButton(name, icon.id, icon.fileExtension));
      tr.append(tdImg, tdId, tdName, tdExt, tdDel);
    }
    tbody.appendChild(tr);
  }
}

function cell(tag, text, cls) {
  const el = document.createElement(tag);
  el.textContent = text;
  if (cls) el.className = cls;
  return el;
}

function deleteButton(name, id, ext) {
  const del = document.createElement("button");
  del.className = "danger";
  del.textContent = "Delete";
  del.onclick = async () => {
    if (!confirm("Delete " + currentCat + " icon " + name + " (id " + id + ")?")) return;
    del.disabled = true;
    try {
      await api("/api/delete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ category: currentCat, id, name, fileExtension: ext }),
      });
      status("deleted " + name, "ok");
      await refresh();
    } catch (err) { status("delete failed: " + err.message, "error"); del.disabled = false; }
  };
  return del;
}

function buildUploadForm() {
  const select = $("#deviceType");
  const types = Object.keys(FAMILIES).sort();
  for (const t of types) {
    const opt = document.createElement("option");
    opt.value = t; opt.textContent = t;
    select.appendChild(opt);
  }
  const renderFields = () => {
    const family = FAMILIES[select.value] || "single";
    const states = STATES[family] || [""];
    const wrap = $("#fileFields");
    wrap.textContent = "";
    for (const suffix of states) {
      const name = "icon" + suffix;
      const label = document.createElement("label");
      label.textContent = name + ".png";
      label.htmlFor = "file-" + name;
      const input = document.createElement("input");
      input.type = "file"; input.accept = "image/png"; input.id = "file-" + name; input.dataset.name = name;
      wrap.append(label, input);
    }
  };
  select.onchange = renderFields;
  renderFields();
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(",")[1]);
    reader.onerror = () => reject(reader.error);
    reader.readAsDataURL(file);
  });
}

async function uploadDevice() {
  const deviceTemplate = $("#deviceType").value;
  const files = {};
  for (const input of document.querySelectorAll("#fileFields input[type=file]")) {
    if (!input.files || !input.files[0]) continue;
    files[input.dataset.name] = await fileToBase64(input.files[0]);
  }
  if (!Object.keys(files).length) { status("pick at least one icon file", "error"); return; }
  const btn = $("#upload");
  btn.disabled = true;
  try {
    const data = await api("/api/upload", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ category: "device", deviceTemplate, files }),
    });
    status("uploaded: " + data.result, "ok");
    await refresh();
  } catch (err) { status("upload failed: " + err.message, "error"); }
  btn.disabled = false;
}

async function uploadSingle() {
  const input = $("#singleFile");
  if (!input.files || !input.files[0]) { status("pick an icon file", "error"); return; }
  const extension = $("#singleExt").value.trim() || "png";
  const btn = $("#uploadSingle");
  btn.disabled = true;
  try {
    const files = { icon: await fileToBase64(input.files[0]) };
    const data = await api("/api/upload", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ category: currentCat, files, fileExtension: extension }),
    });
    status("uploaded: " + data.result, "ok");
    input.value = "";
    await refresh();
  } catch (err) { status("upload failed: " + err.message, "error"); }
  btn.disabled = false;
}

(function init() {
  for (const tab of document.querySelectorAll(".tabs button")) {
    tab.onclick = () => {
      currentCat = tab.dataset.cat;
      for (const other of document.querySelectorAll(".tabs button")) {
        other.classList.toggle("active", other === tab);
      }
      renderTab();
    };
  }
  $("#refresh").onclick = () => refresh().catch((err) => status(err.message, "error"));
  $("#upload").onclick = uploadDevice;
  $("#uploadSingle").onclick = uploadSingle;
  api("/api/families").then((meta) => {
    FAMILIES = meta.families; STATES = meta.states;
    buildUploadForm();
    return refresh();
  }).catch((err) => status("cannot reach flua: " + err.message, "error"));
})();
</script>
</body>
</html>
