<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flua QA Builder</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #1c2430; --muted: #6a7482;
    --line: #dde2e8; --accent: #2563eb; --ok: #15803d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line);
    padding: 14px 24px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header .hc3 { color: var(--muted); font-size: 13px; }
  main { max-width: 980px; margin: 24px auto; padding: 0 24px;
    display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; }
  .card h2 { font-size: 15px; margin: 0 0 12px; }
  .recipe { padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
    margin-bottom: 8px; cursor: pointer; }
  .recipe:hover { border-color: var(--accent); }
  .recipe.active { border-color: var(--accent); background: #f0f5ff; }
  .recipe .title { font-weight: 600; }
  .recipe .desc { color: var(--muted); font-size: 13px; }
  .recipe .cats { color: var(--muted); font-size: 11.5px; margin-top: 4px; }
  .cats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .chip { font: 12.5px/1 inherit; padding: 4px 10px; border-radius: 999px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip .n { opacity: .65; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  label { color: var(--muted); font-size: 13px; min-width: 140px; }
  select, input { font: inherit; padding: 6px 10px; border-radius: 6px;
    border: 1px solid var(--line); background: #fff; min-width: 220px; }
  input[type=number] { min-width: 90px; }
  button.primary { background: var(--accent); color: #fff; border: none;
    font: inherit; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
  pre, textarea.code { background: #10161f; color: #d7e0ec; padding: 14px;
    border-radius: 8px; border: none; font: 12.5px/1.5 ui-monospace, Menlo, monospace;
    width: 100%; height: calc(100vh - 380px); min-height: 320px;
    overflow: auto; white-space: pre; }
  .hint { color: var(--muted); font-size: 13px; }
  #status { grid-column: 1 / -1; color: var(--muted); font-size: 13px; min-height: 1.2em; }
  #status.error { color: #b91c1c; }
  #status.ok { color: var(--ok); }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>flua QA Builder</h1>
  <span class="hc3" id="hc3"></span>
  <button class="primary" id="refresh" style="margin-left:auto">Refresh recipes</button>
</header>
<main>
  <section class="card">
    <h2>Pick a recipe</h2>
    <div id="cats" class="cats"></div>
    <div id="recipes"></div>
  </section>

  <section class="card">
    <h2 id="formTitle">Your QuickApp</h2>
    <div id="form"></div>
    <div class="row">
      <button class="primary" id="generate">Generate</button>
      <button class="primary" id="download" style="background:var(--ok)">Download .lua</button>
      <button class="primary" id="upload" style="background:var(--ok)">Upload to HC3</button>
      <span class="hint">The code below is editable — tweak it, then download or
        upload it to your HC3.</span>
    </div>
    <textarea id="code" class="code hidden" spellcheck="false"></textarea>
  </section>

  <div id="status"></div>
</main>

<script>
"use strict";
const $ = (sel) => document.querySelector(sel);
let INDEX = [], current = null, DEVICES = [], ROOMS = [], SCENES = [], FILTERED = {}, CATEGORY = null;

// the taxonomy — keep in sync with tests/test_recipes.py; categories
// arriving from GitHub that are not listed here get appended to the selector
const CATEGORY_ORDER = ["Lights", "Climate", "Alerts & alarms", "Doors & windows", "Presence"];

function chip(name, count) {
  const el = document.createElement("button");
  el.className = "chip"; el.type = "button";
  const label = document.createElement("span"); label.textContent = name;
  const n = document.createElement("span"); n.className = "n"; n.textContent = " " + count;
  el.append(label, n);
  return el;
}

function renderCats() {
  const counts = new Map();
  for (const recipe of INDEX) {
    for (const cat of recipe.categories || []) counts.set(cat, (counts.get(cat) || 0) + 1);
  }
  const names = CATEGORY_ORDER.filter((c) => counts.has(c));
  for (const cat of counts.keys()) if (!CATEGORY_ORDER.includes(cat)) names.push(cat);
  const wrap = $("#cats");
  wrap.textContent = "";
  const all = chip("All", INDEX.length);
  all.classList.toggle("active", CATEGORY === null);
  all.onclick = () => { CATEGORY = null; renderCats(); renderRecipes(); };
  wrap.appendChild(all);
  for (const name of names) {
    const el = chip(name, counts.get(name));
    el.classList.toggle("active", CATEGORY === name);
    el.onclick = () => { CATEGORY = name; renderCats(); renderRecipes(); };
    wrap.appendChild(el);
  }
}

function renderRecipes() {
  const wrap = $("#recipes");
  wrap.textContent = "";
  for (const recipe of INDEX) {
    if (CATEGORY && !(recipe.categories || []).includes(CATEGORY)) continue;
    const el = document.createElement("div");
    el.className = "recipe";
    el.dataset.id = recipe.id;
    const title = document.createElement("div");
    title.className = "title"; title.textContent = recipe.title;
    const desc = document.createElement("div");
    desc.className = "desc"; desc.textContent = recipe.description;
    el.append(title, desc);
    if (recipe.categories && recipe.categories.length) {
      const cats = document.createElement("div");
      cats.className = "cats"; cats.textContent = recipe.categories.join(" · ");
      el.append(cats);
    }
    el.onclick = () => select(recipe);
    wrap.appendChild(el);
  }
}

function status(msg, kind) {
  const el = $("#status");
  el.textContent = msg;
  el.className = kind || "";
}

async function api(path, options) {
  const res = await fetch(path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.status + " " + res.statusText);
  return data;
}

async function loadIndex(refresh) {
  status("loading recipes…");
  const data = await api("/api/index" + (refresh ? "?refresh=1" : ""));
  INDEX = data.recipes || [];
  CATEGORY = null;  // a refresh resets the filter
  renderCats();
  renderRecipes();
  status(INDEX.length + " recipe(s) ready", "ok");
  await loadHouse();  // pickers need the index (per-type filters) first
}

async function loadHouse() {
  try {
    const devices = await api("/api/devices");
    DEVICES = devices.items || [];
    ROOMS = (await api("/api/rooms")).items || [];
    SCENES = (await api("/api/scenes")).items || [];
    // per-type lists for the device pickers: ?isTypeOf= matches the whole
    // inheritance chain, so a "Light" shows binarySwitch children too
    const filters = new Set();
    for (const recipe of INDEX) {
      for (const param of recipe.params || []) {
        if (param.kind === "device" && param.filter) filters.add(param.filter);
      }
    }
    for (const filter of filters) {
      FILTERED[filter] = (await api("/api/devices?isTypeOf=" + encodeURIComponent(filter))).items || [];
    }
    $("#hc3").textContent = devices.hc3 ? "HC3: " + devices.hc3 : "no HC3 configured — type ids manually";
  } catch (err) {
    $("#hc3").textContent = "no HC3 configured — type ids manually";
  }
}

function optionList(items) {
  const opt = document.createElement("option");
  opt.value = "0"; opt.textContent = "— pick one —";
  const list = [opt];
  for (const item of items) {
    const o = document.createElement("option");
    o.value = String(item.id);
    o.textContent = `${item.name} [${item.id}]` + (item.type ? ` (${item.type.split(".").pop()})` : "");
    list.push(o);
  }
  return list;
}

function select(recipe) {
  current = recipe;
  for (const el of document.querySelectorAll(".recipe")) {
    el.classList.toggle("active", el.dataset.id === recipe.id);
  }
  $("#formTitle").textContent = recipe.title;
  const form = $("#form");
  form.textContent = "";
  for (const param of recipe.params) {
    const row = document.createElement("div");
    row.className = "row";
    const label = document.createElement("label");
    label.textContent = param.label;
    label.htmlFor = "param-" + param.name;
    row.appendChild(label);
    const input = document.createElement(
      param.kind === "device" || param.kind === "room" || param.kind === "scene" ? "select" : "input"
    );
    input.id = "param-" + param.name;
    input.dataset.name = param.name;
    input.dataset.kind = param.kind;
    if (input.tagName === "SELECT") {
      const items = param.kind === "device"
        ? (param.filter ? FILTERED[param.filter] || [] : DEVICES)
        : param.kind === "room" ? ROOMS : SCENES;
      for (const opt of optionList(items)) input.appendChild(opt);
      input.value = String(param.default ?? 0);
    } else {
      input.type = param.kind === "number" ? "number" : param.kind === "boolean" ? "checkbox" : "text";
      if (input.type === "checkbox") {
        input.checked = !!param.default;
        input.style.minWidth = "auto";
      } else {
        input.value = param.default ?? "";
      }
    }
    row.appendChild(input);
    // a typed-id fallback for the pickers (works without an HC3 too)
    if (input.tagName === "SELECT") {
      const manual = document.createElement("input");
      manual.type = "number";
      manual.min = "1";
      manual.placeholder = "or type an id";
      manual.style.minWidth = "110px";
      manual.dataset.manualFor = param.name;
      row.appendChild(manual);
    }
    form.appendChild(row);
  }
  $("#code").classList.add("hidden");
}

function collect() {
  const params = {};
  for (const el of document.querySelectorAll("#form [data-name]")) {
    const name = el.dataset.name;
    const kind = el.dataset.kind;
    if (el.tagName === "SELECT") {
      const manual = document.querySelector(`#form [data-manual-for="${name}"]`);
      const value = manual && manual.value !== "" ? Number(manual.value) : Number(el.value);
      params[name] = value || Number(el.value);
    } else if (el.type === "checkbox") {
      params[name] = el.checked;
    } else if (el.type === "number") {
      params[name] = el.value === "" ? 0 : Number(el.value);
    } else {
      params[name] = el.value;
    }
  }
  return params;
}

async function generate(download) {
  if (!current) { status("pick a recipe first", "error"); return; }
  const params = collect();
  try {
    if (download) {
      const blob = await (await fetch("/api/download", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: current.id, params }),
      })).blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = current.id + ".lua";
      a.click();
      status("downloaded " + current.id + ".lua — upload it to the HC3", "ok");
      return;
    }
    const data = await api("/api/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: current.id, params }),
    });
    const code = $("#code");
    code.value = data.code;
    code.classList.remove("hidden");
    status("generated — the code is editable; review, then download or upload", "ok");
  } catch (err) { status("failed: " + err.message, "error"); }
}

async function upload() {
  const code = $("#code");
  if (!code.value.trim()) { status("generate first", "error"); return; }
  const btn = $("#upload");
  btn.disabled = true;
  try {
    const data = await api("/api/upload", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: code.value }),
    });
    const device = data.device || {};
    status("uploaded " + (device.name || "QA") + " — HC3 device id " + device.id, "ok");
  } catch (err) { status("upload failed: " + err.message, "error"); }
  btn.disabled = false;
}

$("#refresh").onclick = () => loadIndex(true).catch((err) => status(err.message, "error"));
$("#generate").onclick = () => generate(false);
$("#download").onclick = () => generate(true);
$("#upload").onclick = upload;
(async function init() {
  try {
    await loadIndex(true);  // live index; falls back to the cache/snapshot offline
  } catch (err) { status(err.message, "error"); }
})();
</script>
</body>
</html>
