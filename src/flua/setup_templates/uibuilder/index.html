<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flua uibuilder</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --ink:#1c2430; --muted:#6a7482; --line:#dde2e8; --accent:#2563eb; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system, "Segoe UI", sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:10px 16px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0 12px 0 0; }
  select, input, textarea, button { font:inherit; }
  select, input[type=text], input[type=number] { padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  button { padding:5px 12px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.4; cursor:default; }
  main { display:grid; grid-template-columns:180px 1fr 340px; gap:12px; padding:12px 16px; align-items:start; }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px; margin-bottom:10px; }
  section h3 { margin:0 0 6px; font-size:13px; }
  #palette button { display:block; width:100%; margin:4px 0; text-align:left; }
  #palette button:disabled { opacity:.4; cursor:default; }
  .rowstrip { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px 10px; margin-bottom:8px; }
  .rowstrip .head { display:flex; gap:8px; align-items:center; }
  .rowstrip .head .label { font-weight:600; font-size:12px; color:var(--muted); flex:1; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .chip { border:1px solid var(--line); border-radius:14px; padding:2px 10px; cursor:pointer; font-size:12px; background:#fafbfc; }
  .chip.sel { background:var(--accent); color:#fff; border-color:var(--accent); }
  .nested { margin-left:16px; border-left:2px solid var(--line); padding-left:8px; }
  .field { display:flex; gap:6px; align-items:center; margin:4px 0; flex-wrap:wrap; }
  .field label { width:110px; font-size:12px; color:var(--muted); }
  .field input[type=text], .field input[type=number] { flex:1; min-width:80px; }
  .field textarea { flex:1; min-width:200px; height:48px; }
  #preview { width:100%; height:380px; border:1px solid var(--line); border-radius:8px; background:#fff; margin-top:8px; }
  textarea { width:100%; font-family:ui-monospace, monospace; font-size:12px; }
  .hint { font-size:12px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>flua uibuilder</h1>
  <select id="target">
    <option value="main-v2">Main QA — v2 (uiView)</option>
    <option value="main-v1">Main QA — v1 (legacy layout)</option>
    <option value="child">Child device</option>
  </select>
  <span id="rsrcWrap" style="display:none">
    <input id="rsrcName" type="text" size="12" value="ui" placeholder="resource name">
  </span>
  <span class="hint" id="targetHint"></span>
</header>
<main>
  <section id="palette">
    <h3>Elements</h3>
  </section>
  <div>
    <section>
      <h3>Layout</h3>
      <div id="rows"></div>
    </section>
    <section>
      <h3>Preview <span class="hint">(click an element to select)</span></h3>
      <iframe id="preview" src="/viewer?embed=1"></iframe>
    </section>
  </div>
  <div>
    <section id="props">
      <h3>Properties</h3>
      <p class="hint" id="noSel">select an element in the layout (or click it in the preview)</p>
      <div id="propsBody"></div>
    </section>
    <section>
      <h3>Directives <button id="copyBtn" class="primary" style="float:right">copy</button></h3>
      <textarea id="export" rows="7" placeholder="--%%u lines appear here"></textarea>
      <p class="hint" id="exportHint"></p>
    </section>
    <section>
      <h3>Import</h3>
      <textarea id="import" rows="3" placeholder="paste --%%u or --%%rsrc lines"></textarea>
      <button id="importBtn">load</button>
      <p class="hint" id="importErr"></p>
    </section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);

const ELEMENTS = {
  label:       { name: "Label", fields: ["text"], v2: false, hint: "v1 labels may carry HTML" },
  button:      { name: "Button", fields: ["text", "onReleased"], v2: false },
  slider:      { name: "Slider", fields: ["text", "min", "max", "value", "onChanged"], v2: false },
  switch:      { name: "Switch", fields: ["text", "value", "onReleased"], v2: false },
  select:      { name: "Select", fields: ["text", "value", "onToggled", "options"], v2: false },
  multi:       { name: "Multi select", fields: ["text", "values", "onToggled", "options"], v2: false },
  image:       { name: "Image", fields: ["url"], v2: true },
  tabView:     { name: "Tabs", fields: ["activeTab", "onTabChanged", "tabs"], v2: true },
  collapsible: { name: "Collapsible", fields: ["text", "collapsed"], v2: true },
};

const targetHints = {
  "main-v1": "v1: legacy layout — HTML labels, no v2 elements. Exports --%%u.",
  "main-v2": "v2: uiView, UIAction bindings. Add --%%useUiView:true to the QA.",
  "child": "child: uiView with child bindings (actionName = the method). Exports --%%rsrc.",
};

let model = { target: "main-v2", resourceName: "ui", rows: [] };
let selection = null;  // the selected model element
let timer = null;

const elOf = (e) => Object.keys(e).find((k) => ELEMENTS[k]);

function newElement(kind) {
  const base = { text: "", visible: true };
  if (kind === "slider") Object.assign(base, { min: "0", max: "100", value: "50" });
  if (kind === "switch") base.value = "false";
  if (kind === "multi") base.values = [];
  if (kind === "tabView") Object.assign(base, { activeTab: "", onTabChanged: "", tabs: [] });
  if (kind === "collapsible") Object.assign(base, { collapsed: false });
  if (kind === "image") base.url = "";
  base[kind] = "";
  return base;
}

function rowAllows(el) {
  return !["tabView", "collapsible"].includes(elOf(el));
}

function findByName(name) {
  const walk = (rows) => {
    for (const row of rows) {
      for (const el of row) {
        if (el[elOf(el)] === name) return el;
        if (elOf(el) === "tabView") {
          for (const tab of el.tabs || []) {
            const hit = walk(tab.components || []);
            if (hit) return hit;
          }
        }
        if (elOf(el) === "collapsible") {
          const hit = walk(el.components || []);
          if (hit) return hit;
        }
      }
    }
    return null;
  };
  return walk(model.rows);
}

function fieldRow(label, inputEl) {
  const div = document.createElement("div");
  div.className = "field";
  const l = document.createElement("label");
  l.textContent = label;
  div.appendChild(l);
  div.appendChild(inputEl);
  return div;
}

function textInput(value, onInput, placeholder) {
  const i = document.createElement("input");
  i.type = "text";
  i.value = value ?? "";
  if (placeholder) i.placeholder = placeholder;
  i.oninput = () => onInput(i.value);
  return i;
}

function optionsEditor(options, onChange) {
  const ta = document.createElement("textarea");
  ta.value = (options || []).map((o) => (o.text && o.text !== String(o.value) ? o.text + "=" + o.value : String(o.value))).join("\n");
  ta.oninput = () => {
    const opts = ta.value.split("\n").filter((l) => l.trim()).map((l) => {
      const [t, v] = l.includes("=") ? l.split(/=(.*)/s) : [l.trim(), l.trim()];
      return { type: "option", text: t.trim(), value: (v || t).trim() };
    });
    onChange(opts);
  };
  return ta;
}

// ---- the layout pane: row strips with selectable element chips ----------
function rowStrip(container, rows, label, depth) {
  const list = document.createElement("div");
  rows.forEach((row, ri) => {
    const box = document.createElement("div");
    box.className = "rowstrip";
    if (depth) box.classList.add("nested");
    const head = document.createElement("div");
    head.className = "head";
    const rl = document.createElement("span");
    rl.className = "label";
    rl.textContent = (label ? label + " — " : "") + "row " + (ri + 1)
      + (row.length ? " (" + row.length + ")" : " (empty)");
    head.appendChild(rl);
    const rm = document.createElement("button");
    rm.textContent = "✕";
    rm.onclick = () => { rows.splice(ri, 1); selection = null; render(); changed(); };
    head.appendChild(rm);
    const kindSel = document.createElement("select");
    for (const [kind, meta] of Object.entries(ELEMENTS)) {
      if ($("target").value === "main-v1" && meta.v2) continue;
      const o = document.createElement("option");
      o.value = kind; o.textContent = meta.name;
      kindSel.appendChild(o);
    }
    head.appendChild(kindSel);
    const addEl = document.createElement("button");
    addEl.textContent = "＋ element";
    const fullWidth = row.some((el) => !rowAllows(el));
    if (row.length >= 10) {
      addEl.disabled = true;
      addEl.title = "max 10 elements per row (the HC3 editor allows 5, flua 10)";
    } else if (fullWidth) {
      addEl.disabled = true;
      addEl.title = "tabView/collapsible sit alone on their row";
    } else {
      addEl.onclick = () => {
        const el = newElement(kindSel.value);
        row.push(el);
        selection = el;
        render(); changed();
      };
    }
    head.appendChild(addEl);
    box.appendChild(head);

    const chips = document.createElement("div");
    chips.className = "chips";
    row.forEach((el) => {
      const chip = document.createElement("span");
      chip.className = "chip" + (el === selection ? " sel" : "");
      const kind = elOf(el);
      chip.textContent = ELEMENTS[kind].name + (el[kind] ? ": " + el[kind] : "");
      chip.onclick = () => { selection = el; render(); };
      chips.appendChild(chip);
    });
    box.appendChild(chips);

    // nested bodies: tabs and collapsibles
    row.forEach((el) => {
      const kind = elOf(el);
      if (kind === "tabView") {
        (el.tabs || []).forEach((tab) => {
          const sub = document.createElement("div");
          sub.className = "nested";
          sub.style.marginTop = "6px";
          const h = document.createElement("span");
          h.className = "label";
          h.textContent = "tab: " + (tab.name || "?");
          sub.appendChild(h);
          rowStrip(sub, tab.components || [], null, depth + 1);
          box.appendChild(sub);
        });
      } else if (kind === "collapsible") {
        const sub = document.createElement("div");
        sub.className = "nested";
        sub.style.marginTop = "6px";
        el.components = el.components || [];
        rowStrip(sub, el.components, "body", depth + 1);
        box.appendChild(sub);
      }
    });
    list.appendChild(box);
  });
  const addRow = document.createElement("button");
  addRow.textContent = "＋ row";
  addRow.onclick = () => { rows.push([]); render(); changed(); };
  list.appendChild(addRow);
  container.appendChild(list);
}

// ---- the properties pane -----------------------------------------------
function propsFor(el) {
  const kind = elOf(el);
  const meta = ELEMENTS[kind];
  const body = $("propsBody");
  body.innerHTML = "";
  $("noSel").style.display = "none";
  const title = document.createElement("p");
  title.innerHTML = "<b>" + meta.name + "</b>" + (meta.hint ? " <span class='hint'>(" + meta.hint + ")</span>" : "");
  body.appendChild(title);
  const del = document.createElement("button");
  del.textContent = "remove element";
  del.onclick = () => {
    const walk = (rows) => rows.some((row) => {
      const i = row.indexOf(el);
      if (i >= 0) { row.splice(i, 1); return true; }
      return row.some((e) =>
        (elOf(e) === "tabView" && (e.tabs || []).some((t) => walk(t.components || []))) ||
        (elOf(e) === "collapsible" && walk(e.components || [])));
    });
    walk(model.rows);
    selection = null;
    render(); changed();
  };
  body.appendChild(del);
  const bump = () => { render(); changed(); };
  body.appendChild(fieldRow("name", textInput(el[kind], (v) => { el[kind] = v; bump(); }, "element name")));
  for (const f of meta.fields) {
    if (f === "tabs") {
      const addTab = document.createElement("button");
      addTab.textContent = "＋ tab";
      addTab.onclick = () => {
        el.tabs = el.tabs || [];
        el.tabs.push({ name: "tab" + (el.tabs.length + 1), text: "", components: [] });
        bump();
      };
      body.appendChild(addTab);
      (el.tabs || []).forEach((tab, ti) => {
        body.appendChild(fieldRow("tab " + (ti + 1) + " name", textInput(tab.name, (v) => { tab.name = v; bump(); })));
        body.appendChild(fieldRow("tab " + (ti + 1) + " text", textInput(tab.text, (v) => { tab.text = v; bump(); })));
      });
    } else if (f === "options") {
      body.appendChild(fieldRow("options", optionsEditor(el.options, (o) => { el.options = o; bump(); })));
    } else if (["onReleased", "onChanged", "onToggled", "onTabChanged"].includes(f)) {
      body.appendChild(fieldRow(f, textInput(el[f], (v) => { el[f] = v; bump(); }, "method name")));
    } else if (f === "collapsed") {
      const s = document.createElement("select");
      s.innerHTML = "<option value='false'>expanded</option><option value='true'>collapsed</option>";
      s.value = String(el.collapsed ?? false);
      s.onchange = () => { el.collapsed = s.value === "true"; bump(); };
      body.appendChild(fieldRow("collapsed", s));
    } else if (f === "values") {
      body.appendChild(fieldRow("values", textInput((el.values || []).join(","), (v) => { el.values = v ? v.split(",") : []; bump(); })));
    } else {
      body.appendChild(fieldRow(f, textInput(el[f], (v) => { el[f] = v; bump(); })));
    }
  }
}

function render() {
  const palette = $("palette");
  palette.innerHTML = "";
  const phead = document.createElement("h3");
  phead.textContent = "Elements";
  palette.appendChild(phead);
  for (const [kind, meta] of Object.entries(ELEMENTS)) {
    const b = document.createElement("button");
    b.textContent = meta.name;
    b.disabled = $("target").value === "main-v1" && meta.v2;
    b.title = b.disabled ? "v2 element — not available in the v1 layout" : "";
    b.onclick = () => {
      const el = newElement(kind);
      model.rows.push([el]);
      selection = el;
      render(); changed();
    };
    palette.appendChild(b);
  }

  const rowsDiv = $("rows");
  rowsDiv.innerHTML = "";
  rowStrip(rowsDiv, model.rows, null, 0);
  if (!model.rows.length) {
    const p = document.createElement("p");
    p.className = "hint";
    p.textContent = "pick an element from the palette to start";
    rowsDiv.appendChild(p);
  }

  const inModel = !!selection && (() => {
    const walk = (rows) => rows.some((row) => row.includes(selection) ||
      row.some((e) =>
        (elOf(e) === "tabView" && (e.tabs || []).some((t) => walk(t.components || []))) ||
        (elOf(e) === "collapsible" && walk(e.components || []))));
    return walk(model.rows);
  })();
  if (inModel) propsFor(selection);
  else { $("propsBody").innerHTML = ""; $("noSel").style.display = ""; }
}

function changed() {
  model.target = $("target").value;
  model.resourceName = $("rsrcName").value;
  $("targetHint").textContent = targetHints[model.target];
  $("rsrcWrap").style.display = model.target === "child" ? "" : "none";
  clearTimeout(timer);
  timer = setTimeout(compile, 300);
}

async function compile() {
  try {
    const res = await fetch("/flua/uibuilder/compile", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ target: model.target, rows: model.rows, resourceName: model.resourceName }),
    });
    const data = await res.json();
    if (!res.ok) { $("exportHint").textContent = "error: " + data.error; return; }
    $("export").value = (data.directives || []).join("\n");
    $("exportHint").textContent =
      model.target === "main-v2" ? "add --%%useUiView:true to the QA" :
      model.target === "child" ? "paste into the QA that creates the child" :
      "the QA renders this as the legacy layout";
    $("preview").src = "/viewer?embed=1&t=" + Date.now();
  } catch (e) { $("exportHint").textContent = "compile failed: " + e; }
}

$("target").onchange = () => { changed(); render(); };
$("rsrcName").oninput = changed;
$("copyBtn").onclick = () => { navigator.clipboard.writeText($("export").value); };
$("importBtn").onclick = async () => {
  try {
    const res = await fetch("/flua/uibuilder/parse", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: $("import").value }),
    });
    const data = await res.json();
    if (!res.ok) { $("importErr").textContent = data.error; return; }
    if (data.resources && data.resources.length) {
      model.rows = data.resources[0].rows || [];
      model.resourceName = data.resources[0].name || "ui";
      model.target = "child";
    } else {
      model.rows = data.rows || [];
      model.target = "main-v2";
    }
    selection = null;
    $("target").value = model.target;
    $("rsrcName").value = model.resourceName;
    $("importErr").textContent = "";
    render();
    changed();
  } catch (e) { $("importErr").textContent = String(e); }
};

$("preview").onload = () => {
  const doc = $("preview").contentDocument;
  if (!doc) return;
  // same origin: map clicks in the preview to element selection
  doc.addEventListener("click", (e) => {
    const hit = e.target.closest("[data-cname]");
    if (!hit) return;
    const el = findByName(hit.dataset.cname);
    if (el) { selection = el; render(); }
  }, true);
};

render();
changed();
</script>
</body>
</html>
